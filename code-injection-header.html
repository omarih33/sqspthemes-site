     SQSPThemes site layer
     Paste into: Website Tools → Code Injection → HEADER
     Keep your member-login code where it is (Footer).
     Permanent loader: Cloudflare Pages auto-deploys every commit to main.
     ========================================================== -->

<script>
window.SQT_CONFIG = {
  // Kit form action, from your Kit form's HTML embed
  kitAction: "PASTE_KIT_FORM_ACTION_URL",
  readers: "5,400 readers",

  headline: "What's worth knowing in the Squarespace world.",
  subhead: "News, opportunities, tools, and ideas for people building businesses around Squarespace.",

  // Topics = Squarespace CATEGORIES (create these, assign one per post)
  topics: ["Forms", "Navigation & headers", "Blog", "Commerce", "Member areas",
           "Images & galleries", "Animations & scroll", "Mobile", "SEO", "Integrations"],

  // Post types = Squarespace TAGS
  types: ["How-to", "News", "Tools", "Opportunities"],

  opportunity: {
    name: "Bigger Budget Projects",
    url: "/rfps",
    text: "Website RFPs for independent designers and studios."
  },

  // Pages that get the dark mode switch (pages fully redrawn by the layer)
  themePaths: ["*"],
  owner: "SQSPThemes"
};

/* guard: turns the layer on before the page paints, picks light/dark,
   and switches itself off if the files don't load within 4 seconds */
(function (d) {
  if (window.self !== window.top) return; // Squarespace editor: leave the native site editable
  var h = d.documentElement, c = window.SQT_CONFIG || {};
  var p = location.pathname.replace(/\/+$/, "") || "/";
  var themed = (c.themePaths || ["*"]).some(function (x) {
    if (x === "*") return true;
    x = x.replace(/\/+$/, "") || "/";
    return x === "/" ? p === "/" : (p === x || p.indexOf(x + "/") === 0);
  });
  var prefs = { vibe: "2010", mode: "auto", background: "default", accent: "default", textSize: "default", density: "comfortable" };
  if (themed) {
    try {
      var raw = localStorage.getItem("sqt-preferences");
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved && typeof saved === "object") {
          Object.keys(prefs).forEach(function (k) {
            if (saved[k]) prefs[k] = saved[k];
          });
        }
      } else {
        var legacyTheme = localStorage.getItem("sqt-theme") || "";
        var legacyStyle = localStorage.getItem("sqt-style") || "";
        if (legacyTheme === "light" || legacyTheme === "dark") prefs.mode = legacyTheme;
        if (legacyStyle === "editorial" || legacyStyle === "2010") prefs.vibe = legacyStyle;
      }
    } catch (e) {}
  }
  var resolvedTheme = prefs.mode;
  if (resolvedTheme !== "light" && resolvedTheme !== "dark") {
    resolvedTheme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  h.setAttribute("data-theme", resolvedTheme);
  h.setAttribute("data-sqt-mode", prefs.mode);
  h.setAttribute("data-sqt-style", prefs.vibe === "editorial" ? "editorial" : "2010");
  h.setAttribute("data-sqt-bg", prefs.background || "default");
  h.setAttribute("data-sqt-accent", prefs.accent || "default");
  h.setAttribute("data-sqt-text-size", prefs.textSize || "default");
  h.setAttribute("data-sqt-density", prefs.density || "comfortable");
  h.classList.add("sqt-on");
  setTimeout(function () {
    if (!h.classList.contains("sqt-ready")) h.classList.remove("sqt-on");
  }, 4000);
})(document);
</script>
